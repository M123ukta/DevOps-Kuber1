<!DOCTYPE html>
<html>
<head>
  <title>Student Feedback</title>
  <style>
    body { font-family: Arial; background:#eef2f7; margin:0; }
    header { background:#1a3c6e; color:#fff; padding:20px; text-align:center; }
    .box { background:#fff; width:420px; margin:25px auto; padding:20px; border-radius:8px; box-shadow:0 2px 6px #0002; }
    label { display:block; margin-top:12px; font-weight:bold; }
    input, select, textarea { width:100%; padding:8px; margin-top:4px; box-sizing:border-box; }
    button { margin-top:18px; width:100%; padding:10px; background:#1a3c6e; color:#fff; border:none; cursor:pointer; }
  </style>
</head>
<body>
  <header><h1>Student Feedback Form (v2)</h1></header>
  <div class="box">
    <form id="fbForm">
      <label>Course Name</label><input type="text" id="course" required>
      <label>Faculty Name</label><input type="text" id="faculty" required>
      <label>Student Name</label><input type="text" id="sname" required>
      <label>Register Number</label><input type="text" id="regno" required>
      <label>Department</label><input type="text" id="dept" required>
      <label>Rating</label>
      <select id="rating" required>
        <option value="">Select</option>
        <option value="5">5 - Excellent</option><option value="4">4 - Good</option>
        <option value="3">3 - Average</option><option value="2">2 - Poor</option><option value="1">1 - Very Poor</option>
      </select>
      <label>Feedback / Comments</label><textarea id="comments" rows="4"></textarea>
      <button type="submit">Submit</button>
    </form>
  </div>
  <div class="box" id="thanks" style="display:none; text-align:center;">
    <h2 style="color:green;">Thank you for your feedback!</h2>
    <p id="summary"></p>
  </div>
  <script>
    let ratings = [];
    document.getElementById('fbForm').addEventListener('submit', function(e) {
      e.preventDefault();
      ratings.push(parseInt(document.getElementById('rating').value));
      const avg = (ratings.reduce((a,b) => a+b, 0) / ratings.length).toFixed(1);
      document.getElementById('summary').innerText =
        'Course rating summary: ' + avg + ' / 5 from ' + ratings.length + ' response(s)';
      document.getElementById('thanks').style.display = 'block';
      this.reset();
    });
  </script>
</body>
</html>
